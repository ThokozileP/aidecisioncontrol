# This project deploys as a Cloudflare "Workers Build".
#
# IMPORTANT — the dashboard's "Deploy command" MUST run the build before
# `wrangler deploy`, in one shell line, e.g.:
#
#   npm run build && npx wrangler deploy
#
# Two production deploys have now failed because that wasn't true — the
# actual deploy logs showed only "Executing user deploy command: npx
# wrangler deploy", no build step at all, meaning dist/ never existed when
# wrangler started. If the dashboard's "Deploy command" is currently just
# `npx wrangler deploy` (with a separate "Build command" field left empty,
# or one Cloudflare isn't actually running before deploy), change it to the
# line above. See README.md "Cloudflare deployment" for the full story and
# every dead end already ruled out — do not re-attempt setting `main` or
# `[assets].directory` explicitly in this file without reading that first;
# every variant tried breaks either `astro build` itself or `wrangler
# deploy`, in ways that are not obvious from the error message alone.
#
# With the build genuinely completed first, `wrangler deploy` picks up the
# adapter's own generated dist/server/wrangler.json automatically ("Using
# redirected Wrangler configuration") — which is why `main` and
# `[assets].directory` are deliberately NOT set below. This file only needs
# to declare the bindings the app actually uses.
name = "aidecisioncontrol"
compatibility_date = "2026-08-01"

[assets]
# Without this, Workers assets return a generic Cloudflare 404 instead of
# our branded custom 404 page for any unmatched path.
not_found_handling = "404-page"

# Workers Logs: captures invocation logs (including console.log/error from
# the membership API routes and webhook handler) and persists them to the
# Cloudflare dashboard so they're queryable after the fact — useful given
# `astro dev`'s worker sandbox doesn't reliably surface console output to
# the terminal (see the membership webhook/checkout routes' error logging).
[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Membership applications/records are stored in Workers KV. `astro dev` /
# `wrangler dev` simulate this namespace locally with no setup needed, but
# the placeholder id below MUST be replaced with a real namespace id before
# deploying to production: run `npx wrangler kv namespace create MEMBERSHIPS`
# and paste the returned id here. See README.md "Membership application".
[[kv_namespaces]]
binding = "MEMBERSHIPS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
