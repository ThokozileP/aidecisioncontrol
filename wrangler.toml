# This project deploys as a Cloudflare "Workers Build", with Build command
# `npm run build` and Deploy command `npx wrangler deploy` configured as two
# genuinely separate dashboard-configured pipeline steps (Settings → Build)
# — confirmed correct; don't second-guess this again without fresh evidence
# from an actual deploy log.
#
# With the build genuinely completed first, `wrangler deploy` picks up the
# adapter's own generated dist/server/wrangler.json automatically ("Using
# redirected Wrangler configuration") — which is why `main` and
# `[assets].directory` are deliberately NOT set below. See README.md
# "Cloudflare deployment" for the two ways setting them explicitly was
# tried and broke either `astro build` itself or `wrangler deploy` — don't
# re-attempt that without reading it first. This file only needs to declare
# the bindings the app actually uses.
name = "aidecisioncontrol"
compatibility_date = "2026-08-01"

[assets]
# Without this, Workers assets return a generic Cloudflare 404 instead of
# our branded custom 404 page for any unmatched path.
not_found_handling = "404-page"
# Without this, Cloudflare's static-asset router intercepts any request that
# looks like a browser page navigation (Accept: text/html) and doesn't match
# a pre-built static file — which includes every SSR page (`prerender =
# false`, e.g. /admin/memberships, /membership/success) — and serves the
# not_found_handling page above directly, without ever invoking the Worker.
# fetch()/XHR calls (different Accept header, e.g. the membership checkout
# API) were unaffected and worked the whole time, which is why this went
# unnoticed. `run_worker_first` forces every request through the Worker
# first, so Astro's own router (and its 404 page) decides what's missing.
run_worker_first = true

# Workers Logs: captures invocation logs (including console.log/error from
# the membership API routes and webhook handler) and persists them to the
# Cloudflare dashboard so they're queryable after the fact — useful given
# `astro dev`'s worker sandbox doesn't reliably surface console output to
# the terminal (see the membership webhook/checkout routes' error logging).
[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Membership applications/records are stored in Workers KV. No `id` is set
# here on purpose: wrangler auto-provisions a real KV namespace for any
# binding whose `id` is missing/empty on `wrangler deploy` ("Resources
# provisioned, continuing with deployment...") — the same mechanism that
# already auto-provisioned the unrelated `SESSION` binding below (an
# Astro-internal feature this adapter enables automatically). `astro dev` /
# `wrangler dev` simulate this namespace locally with no setup needed
# either way. See README.md "Membership application".
[[kv_namespaces]]
binding = "MEMBERSHIPS"

# Volunteer applications (/careers, /api/volunteers/apply) get their own KV
# namespace. Unlike MEMBERSHIPS, this has an explicit `id` — omitting it (to
# rely on the same no-`id`/auto-provision mechanism as MEMBERSHIPS) failed
# on this project's first deploy of this binding: the dashboard "Workers
# Build" pipeline treated the missing id as "inherit this binding from the
# previously deployed Worker version" rather than provisioning a new
# namespace, which errored (code 10057) since there was no previous version
# with this binding name yet. Created with `wrangler kv namespace create
# VOLUNTEERS`. See README.md "Volunteer applications".
[[kv_namespaces]]
binding = "VOLUNTEERS"
id = "9773fece2dcb49b6a9c025bc08dd30f3"

# CVs uploaded via the volunteer application form. KV isn't meant for binary
# files, so these go to R2 instead. Has an explicit `bucket_name` for the
# same reason VOLUNTEERS above has an explicit `id` — the same "inherit
# binding" first-deploy failure applies to r2_buckets too. Create with
# `wrangler r2 bucket create <name>` (R2 must be enabled on the account via
# the Cloudflare dashboard first if it isn't already — the API/CLI can't do
# that step). See README.md "Volunteer applications".
[[r2_buckets]]
binding = "VOLUNTEER_CVS"
bucket_name = "aidecisioncontrol-volunteer-cvs"
