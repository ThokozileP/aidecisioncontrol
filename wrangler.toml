# This project deploys as a Cloudflare "Workers Build": the dashboard runs
# a Build command (`npm run build`) and a Deploy command (`npx wrangler
# deploy`) as two separate pipeline steps — see README.md "Cloudflare
# deployment".
name = "aidecisioncontrol"
compatibility_date = "2026-08-01"

# The site moved from pure static assets to Astro's server output (see
# astro.config.mjs) so the /membership flow can run real API routes
# (Stripe checkout + webhook). The @astrojs/cloudflare adapter's Vite-based
# build writes the actual worker + manifest into dist/server, but that path
# is build-generated and its exact contents are an implementation detail —
# `main` below points at the adapter's own stable package entrypoint
# instead, which wraps whatever the build produced. This one line matters:
#
#   main = "@astrojs/cloudflare/entrypoints/server"
#
# Do NOT change this to a `dist/server/...` path. It resolves inside
# node_modules and exists from `npm install` alone, before any build runs —
# unlike a `dist/` path, which does not exist yet on a clean checkout. That
# distinction is the whole reason this line is written this way: `wrangler
# deploy` decides whether it's deploying "a Worker" or "assets only" by
# checking whether `main` resolves *before* running a build, and never
# re-checks afterwards. Point `main` at a `dist/` path (or add a `[build]`
# table here to build it inline) and that check fails on a clean checkout —
# wrangler locks in "assets-only" mode, then the `[[assets]]` binding below
# (which requires a Worker) fails with "Cannot use assets with a binding in
# an assets-only Worker". This exact failure mode is what broke the first
# production deploy of the membership feature.
main = "@astrojs/cloudflare/entrypoints/server"

[assets]
directory = "./dist/client"
binding = "ASSETS"
# Without this, Workers assets return a generic Cloudflare 404 instead of
# our branded custom 404 page for any unmatched path.
not_found_handling = "404-page"

# Membership applications/records are stored in Workers KV. `astro dev` /
# `wrangler dev` simulate this namespace locally with no setup needed, but
# the placeholder id below MUST be replaced with a real namespace id before
# deploying to production: run `npx wrangler kv namespace create MEMBERSHIPS`
# and paste the returned id here. See README.md "Membership application".
[[kv_namespaces]]
binding = "MEMBERSHIPS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
