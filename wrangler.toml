# This Cloudflare project's build pipeline runs `npx wrangler deploy`
# (Workers-style deploy, not the classic Pages pipeline), so it needs an
# [assets] block telling it where the static build output lives — there
# is no Worker script (`main`) because the site has no server-side logic.
name = "aidecisioncontrol"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
